[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-rl"
version = "0.1.0"
description = "Reproducible SAC benchmark for inverse passive myocardial mechanics"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "torch>=2.4,<3",
  "gymnasium>=1.0,<2", "stable-baselines3>=2.5,<3",
  "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cardiac-rl = "cardiac_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
